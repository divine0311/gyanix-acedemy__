services:render.yaml
  - type: web
    name: gyanix-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_EMAIL
        sync: false
      - key: RATE_LIMIT_FORMS_MAX
        value: "100"
      - key: RATE_LIMIT_CHAT_MAX
        value: "200"
      - key: RESEND_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
