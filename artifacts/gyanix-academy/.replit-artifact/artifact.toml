kind = "web"
previewPath = "/"
title = "Gyanix Academy"
version = "1.0.0"
id = "artifacts/gyanix-academy"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24128

[services.development]
run = "pnpm --filter @workspace/gyanix-academy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gyanix-academy", "run", "build" ]
serve = "static"
publicDir = "artifacts/gyanix-academy/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24128"
BASE_PATH = "/"
